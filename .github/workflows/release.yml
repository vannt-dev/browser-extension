name: Release & Upload Store Package

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: Build & Publish Release Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          # No cache in the job that builds the release: a poisoned cache would ship.
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Package Release ZIP
        run: npm run zip

      # Reads the ZIP the way the Chrome Web Store review does (the 1.1.3 rejection, "Blue Argon").
      - name: Find the Store ZIP
        id: zip
        run: echo "path=$(ls dist/zips/*.zip)" >> "$GITHUB_OUTPUT"

      - name: Check the Store ZIP for remotely hosted code
        uses: vannt-dev/mv3-remote-code-check@9e84b492001753fcc2c640c4b7b8ff4445bf0866 # v0.5.0
        with:
          path: ${{ steps.zip.outputs.path }}

      - name: Attest Release ZIP
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/zips/*.zip

      - name: Get Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Create GitHub Release & Attach Package
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Release ${{ env.VERSION }}
          body: |
            ## ⚡ Universal File Converter Extension ${{ env.VERSION }}
            
            ### 📦 Download Ready-to-Upload Store Package
            Download the attached `universal-file-converter-${{ env.VERSION }}.zip` below and upload directly to Chrome Web Store or Microsoft Edge Add-ons Developer Dashboard.

            ### 🔏 Verify
            `gh attestation verify universal-file-converter-${{ env.VERSION }}.zip --owner vannt-dev`
          files: |
            dist/zips/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
