name: Offline browser kit

# Runs tests/offline/run.mjs on the Store package built from the chosen branch: the features in a
# real Chromium that cannot resolve any host name. Started by hand (Actions > Run workflow),
# for example before a Store upload; it is not part of every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-kit:
    name: Offline kit on the release ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Unit tests, build and ZIP, as the release workflow makes them.
      - name: Package Release ZIP
        run: npm run zip

      # Branded Google Chrome ignores --load-extension, so the kit runs on Playwright's Chromium.
      - name: Install Chromium
        run: npx --yes playwright@1.64.1 install --with-deps chromium

      # The kit runs a headed browser (headless Chrome names downloads by GUID); xvfb is its screen.
      - name: Run the offline kit
        run: xvfb-run -a npm run test:offline -- dist/zips/universal-file-converter-v*.zip --work=offline-kit-work

      - name: Keep the kit's files when it fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-kit-work
          path: |
            offline-kit-work/console.log
            offline-kit-work/downloads/
          if-no-files-found: ignore
