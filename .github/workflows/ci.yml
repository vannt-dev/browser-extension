name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - LICENSE

# A new push to the same pull request cancels the older run; runs on a branch always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Build and Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Extension (Vite)
        run: npm run build

      - name: Test ZIP Packaging
        run: npm run zip

      # Reads the ZIP the way the Chrome Web Store review does (the 1.1.3 rejection, "Blue Argon").
      - name: Find the Store ZIP
        id: zip
        run: echo "path=$(ls dist/zips/*.zip)" >> "$GITHUB_OUTPUT"

      - name: Check the Store ZIP for remotely hosted code
        uses: vannt-dev/mv3-remote-code-check@v0
        with:
          path: ${{ steps.zip.outputs.path }}
